name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2CB1BC&color_dots=#ebedf0,#c9b8ff,#a389f4,#7F5AF0,#5a3dc4
            dist/github-snake-dark.svg?color_snake=#00D9FF&color_dots=#161b22,#3b2a6e,#5a3dc4,#7F5AF0,#b69cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
